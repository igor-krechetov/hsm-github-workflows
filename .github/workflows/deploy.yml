name: "Deploy Package (Reusable)"

on:
  workflow_call:
    inputs:
      deploy_target:
        description: "Comma-separated targets: platformio,arduinoide"
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      commit_version:
        required: false
        type: string
        default: ''
      target_repo:
        description: "Target repo in owner/name format"
        required: true
        type: string
      platformio_target_branch:
        required: false
        type: string
        default: 'main'

    secrets:
      HSMCPP_BOT_TOKEN:
        required: true
      BOT_GPG_PRIVATE_KEY:
        required: true
      BOT_GPG_PASSPHRASE:
        required: true
      PLATFORMIO_TOKEN:
        required: false

jobs:
  prepare_args:
    name: "Parse Deploy Arguments"
    runs-on: ubuntu-latest
    outputs:
      targets_json: ${{ steps.parse.outputs.targets_json }}
    steps:
      - name: Parse deploy_target input
        id: parse
        shell: bash
        run: |
          targets="${{ inputs.deploy_target }}"
          json="[$(printf '"%s",' ${targets//,/ })]"
          json="${json%,}]"
          echo "targets_json=$json" >> $GITHUB_OUTPUT

  deploy_platformio:
    name: "Deploy PlatformIO"
    needs: prepare_args
    if: >
      inputs.commit_version != '' &&
      contains(needs.prepare_args.outputs.targets_json, 'platformio')
    runs-on: ubuntu-latest

    env:
      target_dir: ./deploy_target

    steps:
      - uses: actions/checkout@v6
        with:
          path: ./main

      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.HSMCPP_BOT_TOKEN }}
          ref: ${{ inputs.platformio_target_branch }}
          path: ${{ env.target_dir }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          workdir: ${{ env.target_dir }}

      - name: Install PlatformIO
        run: pip3 install --user platformio

      - name: Generate package for PlatformIO
        run: |
          cmake -S ./main -B ./main/build -DHSMBUILD_TARGET=platformio -DHSMBUILD_PLATFORM=arduino
          cmake --build ./main/build --target install

      - name: Copy package files to target repository
        run: |
          cp -Rv ./main/build/deploy/platformio/* "${{ env.target_dir }}/"

      - name: Publish PlatformIO package
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pio pkg publish --type library --no-interactive "$PWD/main/build/deploy/platformio/"

      - name: Prepare commit message
        run: |
          cd ./main
          git log -1 --format=%B "${{ inputs.commit_sha }}" > ../commit.txt

      - name: Commit and push files
        run: |
          cd "${{ env.target_dir }}"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -S -F ../commit.txt
          git push

  deploy_arduinoide:
    name: "Deploy ArduinoIDE"
    needs: prepare_args
    if: >
      inputs.commit_version != '' &&
      contains(needs.prepare_args.outputs.targets_json, 'arduinoide')
    runs-on: ubuntu-latest

    env:
      target_dir: ./deploy_target
      library_dir: ./main/build/deploy/hsmcpp

    steps:
      - uses: actions/checkout@v6
        with:
          path: ./main

      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.HSMCPP_BOT_TOKEN }}
          ref: main
          path: ${{ env.target_dir }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          workdir: ${{ env.target_dir }}

      - name: Generate package for ArduinoIDE
        run: |
          cmake -S ./main -B ./main/build -DHSMBUILD_TARGET=arduinoide -DHSMBUILD_PLATFORM=arduino
          cmake --build ./main/build --target install
          mv ./main/build/deploy/arduinoide "${{ env.library_dir }}"

      - name: Validate arduino library structure
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-lint/main/etc/install.sh | BINDIR=./ sh
          ./arduino-lint --compliance strict --recursive --library-manager update "${{ env.library_dir }}"

      - name: Copy package files to target repository
        run: |
          cp -Rv "${{ env.library_dir }}"/* "${{ env.target_dir }}/"

      - name: Prepare commit message
        run: |
          cd ./main
          git log -1 --format=%B "${{ inputs.commit_sha }}" > ../commit.txt

      - name: Commit and push files
        run: |
          cd "${{ env.target_dir }}"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -S -F ../commit.txt
          git tag "${{ inputs.commit_version }}"
          git push
          git push --tags