name: "Update Documentation (Reusable)"

on:
  workflow_call:
    inputs:
      library_name:
        description: "Library submodule name to update, for example hsmcpp or hsm-ide"
        required: true
        type: string
      commit_version:
        description: "Commit version"
        required: true
        type: string
    secrets:
      HSMCPP_BOT_TOKEN:
        required: true
      BOT_GPG_PRIVATE_KEY:
        required: true
      BOT_GPG_PASSPHRASE:
        required: true

jobs:
  update-doc-src:
    if: ${{ inputs.commit_version != '' }}
    runs-on: ubuntu-latest

    env:
      target_dir: ./hsmcpp_doc

    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v6
        with:
          repository: igor-krechetov/hsmcpp-doc
          token: ${{ secrets.HSMCPP_BOT_TOKEN }}
          ref: main
          submodules: recursive
          path: ${{ env.target_dir }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v5
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          workdir: ${{ env.target_dir }}

      - name: Update to latest library revision
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ env.target_dir }}"

          submodule_path="./source/${{ inputs.library_name }}"

          if [ ! -d "$submodule_path" ]; then
            echo "Submodule path does not exist: $submodule_path"
            exit 1
          fi

          git -C "$submodule_path" fetch --all
          git -C "$submodule_path" reset --hard origin/main
          git add "$submodule_path"

      - name: Commit and push documentation update
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ env.target_dir }}"

          echo "Found new ${{ inputs.library_name }} version '${{ inputs.commit_version }}'"

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -S -m "[auto] ${{ inputs.library_name }} library updated to ${{ inputs.commit_version }}"
          git push