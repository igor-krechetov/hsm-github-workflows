name: "Prepare Pages badges contribution"
description: >
  Collect generated badge files into a PARTIAL GitHub Pages contribution and
  upload it as a plain artifact. This action does NOT deploy to Pages; a single
  deploy-pages workflow downloads every `pages-*` contribution artifact, merges
  them into one site and performs the one and only Pages deployment. Keeping
  assembly and deployment separate lets several producers (badges, requirements,
  coverage, ...) contribute to the same site without racing each other's
  deployments.

inputs:
  source_dir:
    description: "Directory containing generated badge files"
    required: true
  file_glob:
    description: "Shell glob for badge files relative to source_dir"
    required: true
    default: "tests_result_*"
  pages_dir:
    description: "Temporary directory to assemble this contribution in"
    required: false
    default: "pages-contribution"
  badges_subdir:
    description: "Subdirectory under the Pages root where badges will be stored"
    required: false
    default: "badges"
  artifact_name:
    description: >
      Name of the uploaded contribution artifact. MUST match the `pages-*`
      pattern the deploy-pages workflow globs for.
    required: false
    default: "pages-badges"

runs:
  using: "composite"
  steps:
    - name: Assemble Pages contribution
      shell: bash
      env:
        INPUT_SOURCE_DIR: ${{ inputs.source_dir }}
        INPUT_FILE_GLOB: ${{ inputs.file_glob }}
        INPUT_PAGES_DIR: ${{ inputs.pages_dir }}
        INPUT_BADGES_SUBDIR: ${{ inputs.badges_subdir }}
      run: |
        set -euo pipefail

        if [ -z "${INPUT_FILE_GLOB}" ]; then
          echo "file_glob input is empty"
          exit 1
        fi

        rm -rf "${INPUT_PAGES_DIR}"
        mkdir -p "${INPUT_PAGES_DIR}/${INPUT_BADGES_SUBDIR}"

        shopt -s nullglob
        files=( "${INPUT_SOURCE_DIR}"/${INPUT_FILE_GLOB} )
        shopt -u nullglob

        if [ ${#files[@]} -eq 0 ]; then
          echo "No badge files matched: ${INPUT_SOURCE_DIR}/${INPUT_FILE_GLOB}"
          exit 1
        fi

        for f in "${files[@]}"; do
          if [ -d "$f" ]; then
            echo "Matched path is a directory, expected files: $f"
            exit 1
          fi
        done

        cp "${files[@]}" "${INPUT_PAGES_DIR}/${INPUT_BADGES_SUBDIR}/"

        echo "Assembled badge contribution:"
        find "${INPUT_PAGES_DIR}" -type f | sort

    - name: Upload Pages contribution artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.pages_dir }}
        if-no-files-found: error
        retention-days: 1
